id: integration/im-dingtalk           # 必须与 component.yaml 一致，be-ops 校验

domain: integration
tier: backend

edge_routes:
  - { path: /integration/im/**, auth: required }   # 族级前缀，不是 /integration/im-dingtalk/**

menus:
  - { key: integration.im, title: 钉钉投递排障, permission: integration.im.admin }

data:
  schema: integration_im_dingtalk       # registry/schemas.tsv
  role:   integration_im_dingtalk_rw    # 登录角色，`PG_USER` 的值

# ⚠️ 本组件没有面向用户的数据，只有运维排障用的投递记录——省略
# data_scopes 会被 be-ops 当场拦下，"不需要"必须显式写成 none。
data_scopes: none

permissions:
  - { key: integration.im.admin, title: 钉钉投递排障, type: page }
