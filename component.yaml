apiVersion: brickkit/v1
kind: Component

metadata:
  id: integration/im-dingtalk
  name: DingTalk channel adapter
  version: 2.0.0
  description: The DingTalk member of the IM channel family; sends work notifications for IM dispatch events and publishes the delivery results.
  repository: https://github.com/brickKit/integration-im-dingtalk
  license: Apache-2.0
  vendor: brickKit

tags: [integration, im, dingtalk]

artifacts:
  - type: api-contract
    format: protobuf
    files: [contracts/integration/im/v1/im.proto, contracts/events/im-dingtalk.events.json]
  - type: api-contract
    format: openapi
    files: [contracts/im-dingtalk.openapi.yaml]
  - type: metadata
    files: [assembly.yaml]

dependencies:
  components: []

configSchema:
  type: object
  properties:
    PG_HOST: {type: string}
    PG_PORT: {type: string, default: "5432"}
    PG_DATABASE: {type: string}
    PG_USER: {type: string}
    PG_PASSWORD: {type: string, secret: true}
    PG_SCHEMA: {type: string, default: integration_im_dingtalk}
    NATS_URL: {type: string}
    OTEL_BASE_URL: {type: string, default: ""}
    AUTHZ_BUNDLE_URL: {type: string}
    IAM_JWKS_URL: {type: string}
    DINGTALK_BASE_URL: {type: string, default: "https://oapi.dingtalk.com"}
    DINGTALK_APP_KEY: {type: string}
    DINGTALK_APP_SECRET: {type: string, secret: true}
    DINGTALK_AGENT_ID: {type: string}
  required: [PG_HOST, PG_DATABASE, PG_USER, PG_PASSWORD, NATS_URL, AUTHZ_BUNDLE_URL, IAM_JWKS_URL, DINGTALK_APP_KEY, DINGTALK_APP_SECRET, DINGTALK_AGENT_ID]

deployment:
  type: container
  build: {context: ., dockerfile: Dockerfile}
  port: 8207
  extraPorts:
    - {name: grpc, port: 9207}
  labels:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
  resources:
    requests: {cpu: 100m, memory: 128Mi}

migration:
  command: [./migrate, up]

healthCheck:
  type: http
  path: /healthz

local:
  language: go
  runCommand: [go, run, ./backend/cmd/server]
